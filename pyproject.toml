[project]
name = "globalrisk-ai"
version = "0.1.0"
description = "AI-powered corporate risk intelligence and year-over-year risk evolution analysis platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "GlobalRisk AI Team", email = "team@globalrisk.ai"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pymupdf>=1.25.0",
    "pdfplumber>=0.11.0",
    "python-dotenv>=1.0.0",
    "structlog>=25.0.0",
    "sentence-transformers>=3.0.0",
    "numpy>=2.0.0",
    "groq>=0.7.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.0.0",
    "aiohttp>=3.14.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.8.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
]
llm = [
    "groq>=0.7.0",
    "anthropic>=0.39.0",
    "ollama>=0.3.0",
    "openai>=1.50.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]
vector = [
    "pgvector>=0.2.0",
    "pinecone-client>=3.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "scripts/*", "experiments/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = [
    "tests*",
    "data*",
    "docker*",
    "reports*",
    "experiments*",
    "Phase1_2*",
]
